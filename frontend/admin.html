<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <nav class="bg-red-500 p-4 text-white">
        <h1 class="text-xl">Admin Dashboard</h1>
        <button id="logout" class="float-right">Logout</button>
    </nav>
    <div class="container mx-auto mt-10">
        <div class="mb-6">
            <h2 class="text-2xl font-bold">Analytics</h2>
            <div id="analytics" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4"></div>
        </div>
        <div class="mb-6">
            <h2 class="text-2xl font-bold">Users</h2>
            <table id="usersTable" class="w-full bg-white rounded shadow mt-4">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="p-2">ID</th>
                        <th class="p-2">Email</th>
                        <th class="p-2">Active</th>
                        <th class="p-2">Admin</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="mb-6">
            <h2 class="text-2xl font-bold">Subscriptions</h2>
            <table id="subsTable" class="w-full bg-white rounded shadow mt-4">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="p-2">ID</th>
                        <th class="p-2">User ID</th>
                        <th class="p-2">Stripe ID</th>
                        <th class="p-2">Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="assets/js/admin.js"></script>
</body>
</html>
