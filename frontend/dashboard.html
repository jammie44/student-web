<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-500 p-4 text-white">
        <h1 class="text-xl">StudentHub Dashboard</h1>
        <button id="logout" class="float-right">Logout</button>
    </nav>
    <div class="container mx-auto mt-10 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded shadow">
            <h3 class="text-lg font-bold">AI CV Generator</h3>
            <textarea id="cvInput" placeholder="Enter your details" class="w-full p-2 border mt-2"></textarea>
            <button onclick="generateCV()" class="mt-2 bg-blue-500 text-white p-2 rounded">Generate</button>
            <div id="cvOutput" class="mt-2"></div>
        </div>
        <div class="bg-white p-6 rounded shadow">
            <h3 class="text-lg font-bold">Assignment Formatter</h3>
            <textarea id="assignmentInput" placeholder="Enter assignment text" class="w-full p-2 border mt-2"></textarea>
            <button onclick="formatAssignment()" class="mt-2 bg-blue-500 text-white p-2 rounded">Format</button>
            <div id="assignmentOutput" class="mt-2"></div>
        </div>
        <div class="bg-white p-6 rounded shadow">
            <h3 class="text-lg font-bold">Research Summarizer</h3>
            <textarea id="researchInput" placeholder="Enter research text" class="w-full p-2 border mt-2"></textarea>
            <button onclick="summarizeResearch()" class="mt-2 bg-blue-500 text-white p-2 rounded">Summarize</button>
            <div id="researchOutput" class="mt-2"></div>
        </div>
        <div class="bg-white p-6 rounded shadow">
            <h3 class="text-lg font-bold">Plagiarism Detector</h3>
            <textarea id="plagiarismInput" placeholder="Enter text to check" class="w-full p-2 border mt-2"></textarea>
            <button onclick="detectPlagiarism()" class="mt-2 bg-blue-500 text-white p-2 rounded">Check</button>
            <div id="plagiarismOutput" class="mt-2"></div>
        </div>
        <div class="bg-white p-6 rounded shadow">
            <h3 class="text-lg font-bold">AI Study Assistant</h3>
            <input type="text" id="studyQuestion" placeholder="Ask a question" class="w-full p-2 border mt-2">
            <button onclick="studyCopilot()" class="mt-2 bg-blue-500 text-white p-2 rounded">Ask</button>
            <div id="studyOutput" class="mt-2"></div>
        </div>
        <div class="bg-white p-6 rounded shadow">
            <h3 class="text-lg font-bold">Research Upload</h3>
            <input type="file" id="researchFile" class="mt-2">
            <button onclick="uploadResearch()" class="mt-2 bg-blue-500 text-white p-2 rounded">Upload</button>
            <input type="text" id="researchQuery" placeholder="Ask about uploaded research" class="w-full p-2 border mt-2">
            <button onclick="askResearch()" class="mt-2 bg-blue-500 text-white p-2 rounded">Ask</button>
            <div id="researchAskOutput" class="mt-2"></div>
        </div>
    </div>
    <script src="assets/js/dashboard.js"></script>
</body>
</html>
