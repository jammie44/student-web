[alembic]
script_location = migrations
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# post_write_hooks defines scripts to run after generating
# an SQL script.
# post_write_hooks.type = console_scripts
# post_write_hooks.filename = %(filename)s
# post_write_hooks.template = %(template)s
# post_write_hooks.template_encoding = utf-8
# post_write_hooks.process_revision_directives = console_scripts.process_revision_directives

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S