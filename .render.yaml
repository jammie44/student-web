version: 1
services:
  - type: web
    name: student-web
    env: python
    pythonVersion: 3.12
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
    buildCommand: python3.12 -m pip install -r requirements.txt && alembic upgrade head
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT backend.main:app