services:
  - type: web
    name: studyhub-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: studyhub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        value: "*"
      - key: HUGGINGFACE_API_KEY
        sync: false

databases:
  - name: studyhub-db
    databaseName: studyhub
    user: studyhub_user
    plan: free
    region: oregon
